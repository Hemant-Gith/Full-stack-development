```html
<!DOCTYPE html>
<html>
<head>
    <title>11g and 11h - Arrays</title>
</head>

<body>

    <h2>11g - Increase Each Number by 1</h2>

    <script>
        // 11g
        const numbers = [1, 2, 3];
        const result = [];

        for (let i = 0; i < numbers.length; i++) {
            result.push(numbers[i] + 1);
        }

        console.log(result);
        // [2, 3, 4]


        // 11h
        function addOne(array) {
            const result = [];

            for (let i = 0; i < array.length; i++) {
                result.push(array[i] + 1);
            }

            return result;
        }

        console.log(addOne([1, 2, 3]));
        // [2, 3, 4]

        console.log(addOne([-2, -1, 0, 99]));
        // [-1, 0, 1, 100]
    </script>

</body>
</html>
```
