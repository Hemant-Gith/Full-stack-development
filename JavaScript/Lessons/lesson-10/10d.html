<!DOCTYPE html>
<html>
<head>
    <title>10d - Toggle Button</title>

    <style>
        .toggle-button {
            background-color: rgb(230, 230, 230);
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .is-toggled {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>

    <button class="toggle-button js-button">
        Gaming
    </button>

    <script>
        const button = document.querySelector('.js-button');

        button.addEventListener('click', () => {

            if (button.classList.contains('is-toggled')) {
                button.classList.remove('is-toggled');
            } else {
                button.classList.add('is-toggled');
            }

        });
    </script>

</body>
</html>
