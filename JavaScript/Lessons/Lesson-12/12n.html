<body>

  <h1>Exercise 12n - Filter Eggs</h1>
  <p>Open the console to see the output.</p>

  <script>
    function removeEgg(foods) {
      return foods.filter(function (food) {
        return food !== 'egg';
      });
    }

    console.log(
      removeEgg(['egg', 'apple', 'egg', 'egg', 'ham'])
    );
  </script>

</body>
