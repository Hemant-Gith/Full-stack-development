<!DOCTYPE html>
<html>
<head>
  <title>Lesson 12 - Exercise 12c</title>
</head>
<body>

  <h1>Exercise 12c - setTimeout()</h1>

  <button onclick="changeText();">
    Start
  </button>

  <script>
    function changeText() {
      setTimeout(function () {
        document.querySelector('button').innerHTML = 'Finished!';
      }, 1000);
    }
  </script>

</body>
</html>
