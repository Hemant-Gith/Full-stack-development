<body>

  <h1>Exercise 12m - Array Map</h1>
  <p>Open the console to see the output.</p>

  <script>
    function addNum(array, num) {
      return array.map(function (value) {
        return value + num;
      });
    }

    console.log(addNum([1, 2, 3], 2));
    console.log(addNum([-2, -1, 0, 99], 2));
  </script>

</body>
