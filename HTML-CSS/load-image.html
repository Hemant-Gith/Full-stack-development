<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Exercises 7a - 7c</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
        }

        .container {
            display: flex;
            gap: 70px;
        }

        .exercise {
            text-align: center;
        }

        .heading {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }


        /* 7a */

        .image-7a {
            width: 200px;
            border-radius: 15px;
        }


        /* 7b */

        .square {
            width: 230px;
            height: 230px;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: white;
        }

        .image-7b {
            width: 200px;
            height: 200px;
            object-fit: cover;
        }


        /* 7c */

        .image-7c {
            width: 230px;
            height: 230px;

            object-fit: cover;

            border-radius: 50%;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- 7a -->
        <div class="exercise">

            <div class="heading">
                7a. Load the image, set<br>
                width to 200px and<br>
                add rounded corners
            </div>

            <img
                class="image-7a"
                src="dog.jpg"
                alt="Dog"
            >

        </div>


        <!-- 7b -->
        <div class="exercise">

            <div class="heading">
                7b. Make the image<br>
                a square, center the<br>
                image within the square
            </div>

            <div class="square">

                <img
                    class="image-7b"
                    src="dog.jpg"
                    alt="Dog"
                >

            </div>

        </div>


        <!-- 7c -->
        <div class="exercise">

            <div class="heading">
                7c. Make the image<br>
                a circle (using<br>
                border-radius)
            </div>

            <img
                class="image-7c"
                src="dog.jpg"
                alt="Dog"
            >

        </div>

    </div>

</body>
</html>
