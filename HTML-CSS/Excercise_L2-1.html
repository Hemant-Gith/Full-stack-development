<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chl_exercise</title>
    <style>
        .para1{
            font-size: x-large;
            font-weight: bold;
            font-style: italic;
        }

        .para2{
            color: green ;
            font-size: 20px;
        }

        button{
            border:none;
            height: 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: opacity 0.3s,
            background-color 0.3s;
        }

        .cart{
            background-color: yellow;
        }

        .cart:hover{
            background-color: rgb(183, 220, 22);
            opacity: 0.5;
            box-shadow: 2px 2px 5px rgba(0,0, 0,0.5);
        }

        .buy{
            background-color: yellowgreen;
            margin-left: 5px;
        }
        .buy:hover{
            background-color:rgb(12, 12, 228);
            box-shadow: 3px 3px 5px rgba(0,0, 0,0.5);
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.com/">Back to Amazon</a>
    <p class = "para1">Nike Black Running Shoes</p>
    <p class = "para2"> $39 - in stock</p>
    <p>Free dilivery tommorow</p>

    <button class="cart">Add to cart</button>
    <button class="buy">Buy Now</button>
</body>
</html>
