<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css_buttons</title>
    <style>
        .subscribe {
            background-color:crimson;
            color: azure;
            border: none;
            height: 40px;
            width: 105px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .join {
            background-color:white;
            color: aqua;
            border-color:blue;
            border-style: solid;
            border-width: 1px;
            height: 40px;
            width: 50px;
            border-radius: 5px; 
            cursor: pointer;
            margin:5px;
        }

        .tweet{
            background-color: aqua;
            color: aliceblue;
            height:40px;
            width: 60px;
            border: none;
            border-radius: 20px;
            cursor: pointer;

        }
    </style>
</head>
<body>
    <button class="subscribe">Subscribe</button>
    <button class="join">Join</button>
    <button class="tweet">Tweet</button>
</body>
</html>
