<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .price {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .currency {
            font-size: 25px;
            color: rgb(90, 90, 90);
        }

        .today {
            font-size: 25px;
            color: green;
            margin-bottom: 15px;
        }

        .after-hours {
            font-size: 25px;
            color: rgb(90, 90, 90);
        }

        .negative {
            color: rgb(190, 50, 50);
        }
    </style>
</head>

<body>

    <div class="price">
        1,049.61 <span class="currency">USD</span>
    </div>

    <div class="today">
        +18.05 (1.75%) today
    </div>

    <div class="after-hours">
        After hours 1,048.00
        <span class="negative">-1.61 (0.15%)</span>
    </div>

</body>
</html>
